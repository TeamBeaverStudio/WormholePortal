[project]
site_name = "Wormhole Portal"
site_description = "Official documentation for the Wormhole Portal plugin for Unreal Engine."
site_author = "Team Beaver Studio"
site_url = "https://teambeaverstudio.github.io/WormholePortal_Docs/"
copyright = """
Copyright &copy; 2026 Team Beaver Studio
"""
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started/index.md" },
  { "Features" = "features/index.md" },
  { "Reference" = "reference.md" },
  { "Issues" = "issues/index.md" },
  { "FAQ" = "faq/index.md" },
]
extra_css = [
  "stylesheets/header.css",
  "stylesheets/home.css",
]

[project.extra]
alternate = [
  { name = "English", link = "/WormholePortal_Docs/", lang = "en" },
  { name = "한국어", link = "/WormholePortal_Docs/ko/", lang = "ko" },
]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
