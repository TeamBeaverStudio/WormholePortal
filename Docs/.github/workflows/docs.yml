name: Deploy documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build English documentation
        run: zensical build --config-file zensical.toml --clean --strict
      - name: Build Korean documentation
        run: zensical build --config-file zensical.ko.toml --clean --strict
      - name: Merge language sites
        run: |
          mkdir -p site/ko
          cp -a site-ko/. site/ko/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
